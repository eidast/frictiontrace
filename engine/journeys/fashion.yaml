name: fashion
version: 1

target:
  baseUrl: ${URL}
  country: US
  currency: USD

settings:
  viewport: { width: 1440, height: 900 }
  userAgent: desktop
  locale: en-US
  timezone: America/New_York
  throttle: none
  cookies: []

artifacts:
  har: true
  mhtml: true
  trace: true
  video: true
  screenshots: { viewport: true, fullPage: true }

steps:
  - name: home
    kind: navigate
    url: /
    waitFor: domcontentloaded
    timeoutMs: 15000

  - name: category
    kind: extract_and_click
    selector: "a[data-testid='nav-women']:first-of-type"
    fallback:
      - "a[href*='/women' i]:first-of-type"
      - "a[href*='/mujer' i]:first-of-type"
    waitFor: domcontentloaded
    timeoutMs: 10000

  - name: product_list
    kind: navigate
    url: /category/women
    waitFor: networkidle
    timeoutMs: 10000

  - name: first_product
    kind: extract_and_click
    selector: "a.product-tile:first-of-type"
    fallback:
      - "a[href*='/product' i]:first-of-type"
    waitFor: domcontentloaded
    timeoutMs: 10000

  - name: product_detail
    kind: interact
    actions:
      - findSelector: ""
        action: scroll
        scroll: { to: bottom, smooth: true }
    waitFor: networkidle
    timeoutMs: 10000

  - name: add_to_bag
    kind: interact
    actions:
      - findSelector: "button[data-testid='add-to-bag']"
        fallback:
          - "button:has-text('Add to Bag')"
          - "button:has-text('Add to Cart')"
        optional: true
        onError: skip_step
        action: click
        afterMs: 1500
    waitFor: networkidle
    timeoutMs: 10000

  - name: cart
    kind: navigate
    url: /cart
    waitFor: domcontentloaded
    timeoutMs: 10000

  - name: checkout
    kind: navigate
    url: /checkout
    waitFor: networkidle
    timeoutMs: 10000
